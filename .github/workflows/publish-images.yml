name: Publish images

# Builds the production Docker images (app + docs) and pushes them to GHCR.
# The production LXC only pulls them (see scripts/check_and_deploy.sh), so it never builds anything.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Only the latest commit of main gets deployed, so older runs can be cancelled
concurrency:
  group: publish-images
  cancel-in-progress: true

env:
  APP_IMAGE: ghcr.io/isc-hei/tisc-editor-app
  DOCS_IMAGE: ghcr.io/isc-hei/tisc-editor-docs

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the full history and the tags

      - name: Compute version
        id: version
        run: echo "app_version=$(git describe --tags --always --first-parent --dirty=.dev)" >> "$GITHUB_OUTPUT"

      - name: Sync changelog
        run: cp CHANGELOG.md docs/docs/techdocs/changelog.md

      - name: Docker Buildx setup
        uses: docker/setup-buildx-action@v3

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.app_version }}
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.sha }}
            ${{ env.APP_IMAGE }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build and push docs image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docs/Dockerfile
          push: true
          tags: |
            ${{ env.DOCS_IMAGE }}:${{ github.sha }}
            ${{ env.DOCS_IMAGE }}:latest
          cache-from: type=gha,scope=docs
          cache-to: type=gha,scope=docs,mode=max
