name: Build Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Bun installation
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: docs

      - name: Sync changelog
        run: cp CHANGELOG.md docs/docs/techdocs/changelog.md

      - name: Build
        run: bun run build
        working-directory: docs