services:
  db:
    image: postgres:15
    container_name: tisc-db
    userns_mode: "host"
    environment:
      POSTGRES_USER: tisc_user
      POSTGRES_PASSWORD: qaywsxedc
      POSTGRES_DB: tisc_db
    ports:
      - "5433:5432"
    networks:
      - tisc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tisc_user -d tisc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tisc-app
    userns_mode: "host"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
      - /app/node_modules
      - ./.git:/app/.git:ro
    networks:
      - tisc-network
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://tisc_user:qaywsxedc@db:5432/tisc_db
    command: >
      sh -c "
      git config --global --add safe.directory /app &&
      bun install &&
      bun x prisma generate &&
      bun x prisma db push &&
      bun dev &
      until curl -sf http://localhost:3000/api/ws; do
        echo 'Waiting for Next.js...';
        sleep 1;
      done;
      echo 'Socket.IO initialized';
      wait
      "
    deploy:
      resources:
        limits:
          cpus: '1.0' # Limit to 1 CPU core
          memory: 1.5G  # If request > 1.5Go, the container will be killed
        reservations:
          memory: 512M

networks:
  tisc-network:
    driver: bridge