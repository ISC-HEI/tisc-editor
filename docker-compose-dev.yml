services:
  db:
    image: postgres:15
    container_name: tisc-db
    userns_mode: "host"
    environment:
      POSTGRES_USER: tisc_user
      POSTGRES_PASSWORD: qaywsxedc
      POSTGRES_DB: tisc_db
    ports:
      - "5433:5432"
    networks:
      - tisc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tisc_user -d tisc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tisc-app
    userns_mode: "host"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    expose:
      - "3000"
    volumes:
      - ./app:/app
      - /app/node_modules
      - ./.git:/app/.git:ro
    networks:
      - tisc-network
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://tisc_user:qaywsxedc@db:5432/tisc_db
    command: >
      sh -c "
      git config --global --add safe.directory /app &&
      bun install &&
      bun x prisma generate &&
      bun x prisma db push &&
      bun dev &
      until curl -sf http://localhost:3000/api/ws; do
        echo 'Waiting for Next.js...';
        sleep 1;
      done;
      echo 'Socket.IO initialized';
      wait
      "
    deploy:
      resources:
        limits:
          cpus: '1.0' # Limit to 1 CPU core
          memory: 1.5G  # If request > 1.5Go, the container will be killed
        reservations:
          memory: 512M

  docs:
    image: oven/bun:1-slim
    container_name: tisc-docs
    userns_mode: "host"
    working_dir: /docs
    restart: always
    expose:
      - "3001"
    volumes:
      - ./docs:/docs
      - /docs/node_modules
    networks:
      - tisc-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/docs/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s
    command: >
      sh -c "
      bun install &&
      bunx docusaurus start --host 0.0.0.0 --port 3001 --no-open
      "
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    container_name: tisc-nginx
    depends_on:
      app:
        condition: service_healthy
      docs:
        condition: service_healthy
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tisc-network

networks:
  tisc-network:
    driver: bridge